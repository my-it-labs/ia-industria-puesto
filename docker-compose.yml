name: puesto

services:
  modelo:
    build: .
    command: ["python", "/opt/prueba.py"]
    ports:
      - "8088:8088"
    mem_limit: 2g
    environment:
      MODELO_PATH: /modelos/qwen2.5-0.5b-instruct-q4_k_m.gguf
    volumes:
      - ./modelos:/modelos:ro

  paso:
    build: .
    command: ["python", "/opt/paso.py"]
    mem_limit: 2g
    profiles: ["paso"]
